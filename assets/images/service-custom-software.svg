<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" fill="none">
  <rect width="600" height="375" fill="#f4f6f2"/>
  
  <!-- Subtle Blueprint Grid -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(90, 131, 87, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="sketch-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(37, 39, 36, 0.06)"/>
    </filter>
  </defs>
  <rect width="600" height="375" fill="url(#grid)" />

  <!-- Architectural Frame Cards -->
  <!-- Main System Core -->
  <rect x="210" y="70" width="180" height="110" rx="12" fill="#ffffff" stroke="#252724" stroke-width="2" filter="url(#sketch-glow)"/>
  <rect x="222" y="82" width="156" height="24" rx="6" fill="#e9f2e6"/>
  <circle cx="236" cy="94" r="4" fill="#5a8357"/>
  <text x="250" y="98" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#252724">API CORE GATEWAY</text>
  <line x1="222" y1="120" x2="360" y2="120" stroke="rgba(37, 39, 36, 0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="222" y1="135" x2="330" y2="135" stroke="rgba(37, 39, 36, 0.15)" stroke-width="2"/>
  <line x1="222" y1="150" x2="310" y2="150" stroke="rgba(37, 39, 36, 0.15)" stroke-width="2"/>

  <!-- Left: Client Platforms -->
  <rect x="50" y="100" width="110" height="80" rx="10" fill="#ffffff" stroke="#252724" stroke-width="1.8" filter="url(#sketch-glow)"/>
  <rect x="60" y="110" width="90" height="18" rx="4" fill="#eef2ec"/>
  <text x="70" y="123" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#3f603c">CLIENT SUITE</text>
  <rect x="62" y="136" width="38" height="34" rx="4" fill="#f4f6f2" stroke="rgba(37,39,36,0.3)" stroke-width="1"/>
  <rect x="106" y="136" width="44" height="34" rx="4" fill="#f4f6f2" stroke="rgba(37,39,36,0.3)" stroke-width="1"/>

  <!-- Right: Datastore & Cache -->
  <rect x="440" y="100" width="110" height="80" rx="10" fill="#ffffff" stroke="#252724" stroke-width="1.8" filter="url(#sketch-glow)"/>
  <rect x="450" y="110" width="90" height="18" rx="4" fill="#deecdc"/>
  <text x="460" y="123" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#3f603c">DATASTORE</text>
  <ellipse cx="495" cy="140" rx="30" ry="8" fill="#ffffff" stroke="#252724" stroke-width="1.5"/>
  <ellipse cx="495" cy="152" rx="30" ry="8" fill="#ffffff" stroke="#252724" stroke-width="1.5"/>
  <ellipse cx="495" cy="164" rx="30" ry="8" fill="#ffffff" stroke="#252724" stroke-width="1.5"/>

  <!-- Bottom: Cloud Orchestrator -->
  <rect x="180" y="230" width="240" height="95" rx="12" fill="#ffffff" stroke="#252724" stroke-width="2" filter="url(#sketch-glow)"/>
  <rect x="194" y="242" width="212" height="22" rx="5" fill="#e7f2e4"/>
  <text x="210" y="257" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#252724">DISTRIBUTED CLOUD RUNTIME</text>
  <!-- Microservices nodes -->
  <circle cx="225" cy="290" r="14" fill="#eef2ec" stroke="#5a8357" stroke-width="1.5"/>
  <text x="220" y="294" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#3f603c">S1</text>
  <circle cx="275" cy="290" r="14" fill="#eef2ec" stroke="#5a8357" stroke-width="1.5"/>
  <text x="270" y="294" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#3f603c">S2</text>
  <circle cx="325" cy="290" r="14" fill="#eef2ec" stroke="#5a8357" stroke-width="1.5"/>
  <text x="320" y="294" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#3f603c">S3</text>
  <circle cx="375" cy="290" r="14" fill="#eef2ec" stroke="#5a8357" stroke-width="1.5"/>
  <text x="370" y="294" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#3f603c">S4</text>

  <!-- Connecting Architectural Lines -->
  <path d="M 160 140 L 210 125" stroke="#5a8357" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="140" r="3" fill="#5a8357"/>
  <circle cx="210" cy="125" r="3" fill="#5a8357"/>

  <path d="M 390 125 L 440 140" stroke="#5a8357" stroke-width="2" stroke-linecap="round"/>
  <circle cx="390" cy="125" r="3" fill="#5a8357"/>
  <circle cx="440" cy="140" r="3" fill="#5a8357"/>

  <path d="M 300 180 L 300 230" stroke="#252724" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="300,228 296,220 304,220" fill="#252724"/>

  <!-- Compass / Drafting mark in top right -->
  <g transform="translate(530, 35)">
    <circle cx="15" cy="15" r="15" fill="#eef2ec" stroke="rgba(37,39,36,0.2)" stroke-width="1"/>
    <line x1="15" y1="5" x2="15" y2="25" stroke="#5a8357" stroke-width="1.5"/>
    <line x1="5" y1="15" x2="25" y2="15" stroke="#5a8357" stroke-width="1.5"/>
  </g>
</svg>
